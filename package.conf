# Audiobookshelf on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=audiobookshelf
PKG_TITLE="Audiobookshelf"
PKG_DESC="Audiobookshelf, your own audiobook and podcast server, in Container Manager — streaming the books and podcasts in your shared folders to the web and to its phone apps, with listening progress kept in sync, and a DSM window for libraries and scans, users, phone setup with a QR code, backups and updates."
APP_ID="Audiobookshelf.AppInstance"
REPO=tombruton87/audiobookshelf-dsm
SERVICES="server"
VOLUMES="config metadata"
IMAGE_VARS="ABS_IMAGE"
PORT=13378
PORTS="13378 13379 13380 13388"
HEALTH_PATH=/healthcheck
APP_ACTIONS="libadd|libdel|scan|useradd|userpw|setadmin|userdel|absupdate"
APP_ANSWER_KEYS="ADMIN_USER BOOKS_DIR_B64 PODCASTS_DIR_B64"
APP_REQUEST_KEYS="LIB_ID LIB_NAME_B64 LIB_TYPE LIB_DIR_B64 FULL NUSER USER_ID ROLE"
TAGLINE="audiobooks and podcasts"
WELCOME="Audiobookshelf turns the audiobooks and podcasts on your Synology into your own listening service: a web player, and phone apps that remember where you stopped on every device. This package runs it in Container Manager with your shared folders as its libraries (audiobooks read-only — your files are never changed), makes your account, and adds an Audiobookshelf window to DSM for libraries, users, phones and backups."
BACKUP_WHAT="Audiobookshelf's database (everyone's listening progress, bookmarks, collections, playlists, users and settings) and its metadata (covers, author pictures, item details) — not the audiobooks and podcasts themselves, which stay where they are in your shared folders."
SITE_NOTE="Phones and the web player reach Audiobookshelf at this address — for listening away from home, it must be reachable from outside, ideally over HTTPS: DSM's reverse proxy with a domain and DSM's certificate, steps below. The QR code on the Phones tab follows this address."
ICON_TOP="#CD9D49"
ICON_BOTTOM="#875D27"
ICON_LETTER="A"   # only if icon.png is missing
BETA=yes
